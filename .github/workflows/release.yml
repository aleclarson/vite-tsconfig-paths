name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CI: true

    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Read release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$package_name" != "vite-tsconfig-paths" ]]; then
            echo "Expected package name vite-tsconfig-paths, found $package_name" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            npm_dist_tag="next"
          else
            npm_dist_tag="latest"
          fi

          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $package_name@$package_version with npm dist-tag $npm_dist_tag"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish with provenance
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.npm_dist_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
