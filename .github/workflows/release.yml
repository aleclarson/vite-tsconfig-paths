name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to publish
        required: true
        default: master

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      npm_tag: ${{ steps.package.outputs.npm_tag }}
      publish: ${{ steps.package.outputs.publish }}
      ref: ${{ steps.package.outputs.ref }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Require successful CI
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          successful_runs=$(gh run list \
            --workflow ci.yml \
            --commit "$sha" \
            --status success \
            --json databaseId \
            --jq length)
          if [ "$successful_runs" -eq 0 ]; then
            echo "No successful ci.yml run found for $sha" >&2
            exit 1
          fi

      - name: Read release metadata
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          tag="v$version"
          ref=$(git rev-parse HEAD)

          if [[ "$name" != "vite-tsconfig-paths" ]]; then
            echo "Expected package name vite-tsconfig-paths, found $name" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "$tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          if [ "$(git tag --points-at HEAD --list "$tag")" != "$tag" ]; then
            echo "Expected $tag to point at $ref" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            npm_tag=next
          else
            npm_tag=latest
          fi

          {
            echo "npm_tag=$npm_tag"
            echo "publish=true"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check whether version is published
        id: registry
        run: |
          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public --tag "${{ needs.prepare.outputs.npm_tag }}"
